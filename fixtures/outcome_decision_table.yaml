          reason: "breaking-diff:$.status"
      has_drift_detail: true

  - id: "pre_fingerprint_mismatch_only"
    description: "Spec hash changed before run; observation identical and expectations true -> DRIFT"
    inputs:
      planned: "EXECUTE"
      verification: "valid"
      steps:
        - id: "s1"
          transport_error: null
          pre_fingerprint_match: false
          observation_diff:
            breaking_paths: []
            additive_paths: []
      expectations:
        - id: "e1"
          step_id: "s1"
          reads: ["$.status"]
          raw_eval: "true"
    expected:
      outcome: "DRIFT"
      expectations:
        - id: "e1"
          value: "true"
      has_drift_detail: true

  - id: "earlier_step_drift_blocks_later_step"
    description: "Step 1 drifts (breaking diff), step 2 cannot extract order_id -> step 2 blocked by step 1 -> DRIFT"
    inputs:
      planned: "EXECUTE"
      verification: "valid"
      steps:
        - id: "s1"
          transport_error: null
          pre_fingerprint_match: true
          observation_diff:
            breaking_paths: ["$.id"]
            additive_paths: []
        - id: "s2"
          transport_error: null
          pre_fingerprint_match: true
          blocked_by: "s1"
          observation_diff:
            breaking_paths: []
            additive_paths: []
      expectations:
        - id: "e1"
          step_id: "s1"
          reads: ["$.id"]
          raw_eval: "missing"
        - id: "e2"
          step_id: "s2"
          reads: ["$.status"]
          raw_eval: "unevaluable"
    expected:
      outcome: "DRIFT"
      expectations:
        - id: "e1"
          value: "unevaluable"
          reason: "breaking-diff:$.id"
        - id: "e2"
          value: "unevaluable"
          reason: "blocked-by:s1"
      has_drift_detail: true

  - id: "earlier_step_error_blocks_later_step"
    description: "Step 1 connection refused (ERROR), step 2 blocked -> ERROR"
    inputs:
      planned: "EXECUTE"
      verification: "valid"
      steps:
        - id: "s1"
          transport_error: "connection_refused"
          pre_fingerprint_match: true
          observation_diff:
            breaking_paths: []
            additive_paths: []
        - id: "s2"
          transport_error: null
          pre_fingerprint_match: true
          blocked_by: "s1"
          observation_diff:
            breaking_paths: []
            additive_paths: []
      expectations:
        - id: "e1"
          step_id: "s1"
          reads: ["$.status"]
          raw_eval: "missing"
        - id: "e2"
          step_id: "s2"
          reads: ["$.status"]
          raw_eval: "unevaluable"
    expected:
      outcome: "ERROR"
      expectations:
        - id: "e1"
          value: "unevaluable"
          reason: "transport-error:connection_refused"
        - id: "e2"
          value: "unevaluable"
          reason: "blocked-by:s1"
      has_drift_detail: false

  - id: "connection_refused_step1"
