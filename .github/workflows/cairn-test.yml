name: cairn-test Strict Verification & CI Pipeline

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Verify Approvals & Execute Strict Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Verify Cryptographic Approvals (Pre-flight)
        env:
          CAIRN_ALLOWED_SIGNERS: ${{ secrets.CAIRN_ALLOWED_SIGNERS }}
        run: |
          uv run cairn-test verify

      - name: Execute Suite in Strict Mode
        env:
          CAIRN_ALLOWED_SIGNERS: ${{ secrets.CAIRN_ALLOWED_SIGNERS }}
        run: |
          uv run cairn-test run --strict

