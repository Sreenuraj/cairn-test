[project]
name = "cairn-test"
version = "0.1.0"
description = "A trace-based, domain-neutral test framework for the AI era"
readme = "README.md"
authors = [
    { name = "Sreenuraj", email = "sreenurajvarma@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
